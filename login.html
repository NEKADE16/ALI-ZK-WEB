<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تسجيل الدخول - ALI ZK Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #0a0a2a 100%);
            padding: 20px;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .auth-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .auth-card {
            background: rgba(15, 25, 45, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(108, 92, 231, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .auth-logo i {
            font-size: 3rem;
            color: #00cec9;
        }
        .auth-logo h2 {
            color: white;
            margin-top: 0.5rem;
        }
        .auth-logo span { color: #00cec9; }
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
            background: rgba(255,255,255,0.05);
            padding: 0.3rem;
            border-radius: 60px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            color: #94a3b8;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #6c5ce7;
            color: white;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }
        .input-group i:first-child {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            font-size: 0.95rem;
            color: white;
        }
        .input-group input:focus {
            outline: none;
            border-color: #6c5ce7;
        }
        .input-group input::placeholder { color: #64748b; }
        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
        }
        .captcha-container {
            background: rgba(255,255,255,0.05);
            padding: 0.8rem;
            border-radius: 16px;
            margin: 1rem 0;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .captcha-box span {
            background: rgba(0,0,0,0.5);
            padding: 10px 16px;
            border-radius: 12px;
            font-family: monospace;
            border: 1px solid #6c5ce7;
            color: #00cec9;
            min-width: 100px;
            text-align: center;
        }
        .captcha-box input {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            text-align: center;
        }
        .btn-captcha-refresh {
            background: rgba(108,92,231,0.2);
            border: none;
            cursor: pointer;
            color: #6c5ce7;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .alert {
            padding: 12px;
            border-radius: 14px;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
        .alert-danger {
            background: rgba(220,38,38,0.2);
            color: #f87171;
            border: 1px solid rgba(220,38,38,0.3);
        }
        .alert-success {
            background: rgba(34,197,94,0.2);
            color: #4ade80;
        }
        .forgot-info {
            color: #94a3b8;
            margin-bottom: 1.2rem;
            text-align: center;
            font-size: 0.85rem;
        }
        @media (max-width: 500px) {
            .auth-card { padding: 1.5rem; }
            .captcha-box { flex-direction: column; }
            .captcha-box span { width: 100%; }
            .captcha-box input { width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-code"></i>
                    <h2>ALI ZK <span>code</span></h2>
                </div>
                <p style="color:#94a3b8;">سجل دخولك للوصول إلى المنصة</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
                <button class="tab-btn" data-tab="register">إنشاء حساب</button>
                <button class="tab-btn" data-tab="forgot">نسيت كلمة السر؟</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="اسم المستخدم" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة السر" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <div class="captcha-container">
                    <p><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestion">5 + 3 = ?</span>
                        <input type="text" id="captchaInput" placeholder="أدخل الإجابة" maxlength="3">
                    </div>
                    <button type="button" id="refreshCaptcha" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
            </form>

            <!-- نموذج إنشاء حساب -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regUsername" placeholder="اسم المستخدم" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="الاسم الكامل" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="كلمة السر" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة السر" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <div class="captcha-container">
                    <p><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestionReg">5 + 3 = ?</span>
                        <input type="text" id="captchaInputReg" placeholder="أدخل الإجابة" maxlength="3">
                    </div>
                    <button type="button" id="refreshCaptchaReg" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> إنشاء حساب
                </button>
            </form>

            <!-- نموذج استعادة كلمة المرور -->
            <form id="forgotForm" class="auth-form">
                <p class="forgot-info"><i class="fas fa-info-circle"></i> أدخل اسم المستخدم المسجل وسنرسل لك رابط استعادة كلمة المرور</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="forgotUsername" placeholder="اسم المستخدم" required>
                </div>
                
                <div class="captcha-container">
                    <p><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestionForgot">5 + 3 = ?</span>
                        <input type="text" id="captchaInputForgot" placeholder="أدخل الإجابة" maxlength="3">
                    </div>
                    <button type="button" id="refreshCaptchaForgot" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> إرسال رابط الاستعادة
                </button>
                <div id="forgotMessage"></div>
            </form>

            <div id="authMessage"></div>
            <div style="text-align:center; margin-top:1rem;">
                <a href="index.html" style="color:#6c5ce7; text-decoration:none;"><i class="fas fa-home"></i> العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        // خلفية متحركة
        const canvas = document.getElementById('matrixCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];
        for (let i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * -canvas.height);
        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 42, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * -canvas.height);
        });

        // دوال مساعدة
        function setLocal(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
        function getLocal(key) { return JSON.parse(localStorage.getItem(key)) || []; }

        // تهيئة البيانات
        if (!localStorage.getItem('users')) {
            setLocal('users', [
                { id: 1, username: 'admin', name: 'علي الزين', password: '12344321', role: 'admin', date: new Date().toISOString() }
            ]);
        }

        // CAPTCHA
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10);
            const num2 = Math.floor(Math.random() * 10);
            const op = Math.random() > 0.5 ? '+' : '-';
            let answer = op === '+' ? num1 + num2 : num1 - num2;
            return { question: `${num1} ${op} ${num2} = ?`, answer: answer.toString() };
        }

        function initCaptchas() {
            const login = generateCaptcha();
            const reg = generateCaptcha();
            const forgot = generateCaptcha();
            const q1 = document.getElementById('captchaQuestion');
            const q2 = document.getElementById('captchaQuestionReg');
            const q3 = document.getElementById('captchaQuestionForgot');
            if (q1) { q1.textContent = login.question; q1.dataset.answer = login.answer; }
            if (q2) { q2.textContent = reg.question; q2.dataset.answer = reg.answer; }
            if (q3) { q3.textContent = forgot.question; q3.dataset.answer = forgot.answer; }
        }

        function refreshCaptcha(qId, inputId) {
            const newCaptcha = generateCaptcha();
            const span = document.getElementById(qId);
            if (span) {
                span.textContent = newCaptcha.question;
                span.dataset.answer = newCaptcha.answer;
            }
            const input = document.getElementById(inputId);
            if (input) input.value = '';
        }

        document.getElementById('refreshCaptcha')?.addEventListener('click', () => refreshCaptcha('captchaQuestion', 'captchaInput'));
        document.getElementById('refreshCaptchaReg')?.addEventListener('click', () => refreshCaptcha('captchaQuestionReg', 'captchaInputReg'));
        document.getElementById('refreshCaptchaForgot')?.addEventListener('click', () => refreshCaptcha('captchaQuestionForgot', 'captchaInputForgot'));

        // إظهار/إخفاء كلمة السر
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });

        // تبديل التبويبات
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });

        // تسجيل الدخول
        document.getElementById('loginForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const captchaAnswer = document.getElementById('captchaQuestion').dataset.answer;
            const userAnswer = document.getElementById('captchaInput').value;
            if (userAnswer !== captchaAnswer) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ إجابة CAPTCHA غير صحيحة</div>';
                initCaptchas();
                return;
            }
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const users = getLocal('users');
            const user = users.find(u => u.username === username && u.password === password);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ اسم المستخدم أو كلمة السر غير صحيحة</div>';
            }
        });

        // إنشاء حساب
        document.getElementById('registerForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const captchaAnswer = document.getElementById('captchaQuestionReg').dataset.answer;
            const userAnswer = document.getElementById('captchaInputReg').value;
            if (userAnswer !== captchaAnswer) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ إجابة CAPTCHA غير صحيحة</div>';
                initCaptchas();
                return;
            }
            const username = document.getElementById('regUsername').value;
            const name = document.getElementById('regName').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            if (!username || !name || !password) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ جميع الحقول مطلوبة</div>';
                return;
            }
            if (password !== confirm) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ كلمة السر غير متطابقة</div>';
                return;
            }
            if (password.length < 6) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ كلمة السر يجب أن تكون 6 أحرف على الأقل</div>';
                return;
            }
            const users = getLocal('users');
            if (users.find(u => u.username === username)) {
                document.getElementById('authMessage').innerHTML = '<div class="alert alert-danger">❌ اسم المستخدم موجود مسبقاً</div>';
                return;
            }
            const newUser = {
                id: users.length + 1,
                username, name, password,
                role: 'user',
                date: new Date().toISOString()
            };
            users.push(newUser);
            setLocal('users', users);
            localStorage.setItem('currentUser', JSON.stringify(newUser));
            window.location.href = 'index.html';
        });

        // استعادة كلمة المرور
        document.getElementById('forgotForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const captchaAnswer = document.getElementById('captchaQuestionForgot').dataset.answer;
            const userAnswer = document.getElementById('captchaInputForgot').value;
            if (userAnswer !== captchaAnswer) {
                document.getElementById('forgotMessage').innerHTML = '<div class="alert alert-danger">❌ إجابة CAPTCHA غير صحيحة</div>';
                initCaptchas();
                return;
            }
            const username = document.getElementById('forgotUsername').value;
            const users = getLocal('users');
            const user = users.find(u => u.username === username);
            if (user) {
                document.getElementById('forgotMessage').innerHTML = `<div class="alert alert-success">✅ تم إرسال رابط استعادة كلمة المرور إلى ${user.name}<br><small>كلمة السر الحالية: ${user.password}</small></div>`;
            } else {
                document.getElementById('forgotMessage').innerHTML = '<div class="alert alert-danger">❌ لا يوجد حساب بهذا اسم المستخدم</div>';
            }
        });

        initCaptchas();

        // التحقق من الجلسة
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser && window.location.pathname.includes('login.html')) {
            window.location.href = currentUser.role === 'admin' ? 'admin.html' : 'index.html';
        }
    </script>
</body>
</html>
