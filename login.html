<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تسجيل الدخول - ALI ZK Code</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* تحسينات إضافية للصفحة */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 40px;
        }
        .auth-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #6c5ce7;
            color: white;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }
        .input-group i:first-child {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 1;
        }
        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
        }
        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            z-index: 1;
        }
        .captcha-container {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 14px;
            margin: 1rem 0;
            border: 1px solid #e2e8f0;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .captcha-box span {
            background: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid #e2e8f0;
            min-width: 100px;
            text-align: center;
        }
        .captcha-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            min-width: 80px;
        }
        .btn-captcha-refresh {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #6c5ce7;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-captcha-refresh:hover {
            color: #5b4bc4;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .btn-google {
            background: #4285f4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
        }
        .btn-google:hover {
            background: #3367d6;
            transform: translateY(-2px);
        }
        .auth-divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e2e8f0;
        }
        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }
        .auth-divider span {
            background: white;
            padding: 0 12px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0 0;
            font-size: 0.85rem;
        }
        .alert-danger {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
        .forgot-info {
            color: #64748b;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .auth-message {
            margin-top: 1rem;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }
            .tab-btn {
                font-size: 0.8rem;
                padding: 10px 5px;
            }
            .captcha-box {
                flex-direction: column;
            }
            .captcha-box span {
                width: 100%;
                text-align: center;
            }
            .captcha-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-code"></i>
                    <h2>ALI ZK <span>code</span></h2>
                </div>
                <p style="color:#64748b; margin-top:8px;">سجل دخولك للوصول إلى المنصة</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
                <button class="tab-btn" data-tab="register">إنشاء حساب</button>
                <button class="tab-btn" data-tab="forgot">نسيت كلمة السر؟</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة السر" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <!-- CAPTCHA -->
                <div class="captcha-container">
                    <p style="margin-bottom:10px; font-size:0.85rem;"><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestion">5 + 3 = ?</span>
                        <input type="text" id="captchaInput" placeholder="أدخل الإجابة" maxlength="3" autocomplete="off">
                    </div>
                    <button type="button" id="refreshCaptcha" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
                
                <div class="auth-divider">
                    <span>أو</span>
                </div>
                
                <button type="button" id="googleLoginBtn" class="btn-google btn-block">
                    <i class="fab fa-google"></i> تسجيل الدخول عبر Google
                </button>
            </form>

            <!-- نموذج إنشاء حساب -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="الاسم الكامل" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="كلمة السر" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة السر" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <!-- CAPTCHA للتسجيل -->
                <div class="captcha-container">
                    <p style="margin-bottom:10px; font-size:0.85rem;"><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestionReg">5 + 3 = ?</span>
                        <input type="text" id="captchaInputReg" placeholder="أدخل الإجابة" maxlength="3" autocomplete="off">
                    </div>
                    <button type="button" id="refreshCaptchaReg" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> إنشاء حساب
                </button>
            </form>

            <!-- نموذج استعادة كلمة المرور -->
            <form id="forgotForm" class="auth-form">
                <p class="forgot-info"><i class="fas fa-info-circle"></i> أدخل بريدك الإلكتروني وسنرسل لك رابط استعادة كلمة المرور</p>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="forgotEmail" placeholder="البريد الإلكتروني" required autocomplete="email">
                </div>
                
                <!-- CAPTCHA لاستعادة -->
                <div class="captcha-container">
                    <p style="margin-bottom:10px; font-size:0.85rem;"><i class="fas fa-robot"></i> تأكيد أنك لست روبوتاً:</p>
                    <div class="captcha-box">
                        <span id="captchaQuestionForgot">5 + 3 = ?</span>
                        <input type="text" id="captchaInputForgot" placeholder="أدخل الإجابة" maxlength="3" autocomplete="off">
                    </div>
                    <button type="button" id="refreshCaptchaForgot" class="btn-captcha-refresh"><i class="fas fa-sync-alt"></i> تحديث</button>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> إرسال رابط الاستعادة
                </button>
                <div id="forgotMessage" class="auth-message"></div>
            </form>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/google-auth.js"></script>
</body>
</html>
